services:
  fontku:
    build: .
    image: fontku:latest
    container_name: fontku
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:6767}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6767"]
      interval: 30s
      timeout: 5s
      retries: 3
